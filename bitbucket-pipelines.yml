# =============================================================================
# Bitbucket CI/CD Pipeline — Production Grade
# Angular UI + .NET 8 API → IIS on AWS EC2 (Windows)
# Deploy method: MSDeploy (Web Deploy) via native SSH key auth
#
# ─── ENVIRONMENTS ──────────────────────────────────────────────────────────────
#   • develop branch → Staging  (automatic)
#   • main branch    → Staging (automatic) → Production (manual gate)
#   • Custom pipelines: rollback-ui, rollback-api, promote-to-prod
#
# ─── REQUIRED BITBUCKET SSH SETUP ─────────────────────────────────────────────
#   Repository Settings → SSH keys:
#     1. Generate or paste your private key
#     2. Add the public key to ~/.ssh/authorized_keys on the EC2 server
#     3. Add EC2 IP/hostname to Known Hosts
#
# ─── REQUIRED REPOSITORY VARIABLES ───────────────────────────────────────────
#   PROD_REMOTE_USERNAME       - Windows server login username (prod)
#   PROD_REMOTE_SERVER_IP      - EC2 public or private IP (prod)
#   PROD_IIS_UI_PHYSICAL_PATH  - Physical path of Angular site on prod IIS
#   PROD_IIS_API_PHYSICAL_PATH - Physical path of .NET API on prod IIS
#   PROD_IIS_APP_POOL_NAME     - IIS app pool name (prod)
#   PROD_IIS_SITE_NAME         - IIS site name (prod)
#   PROD_HEALTH_CHECK_URL      - Health check URL e.g. https://yourdomain.com/api/health
#   PROD_UI_URL                - Public UI URL for smoke test
#
#   STG_REMOTE_USERNAME        - Windows server login username (staging)
#   STG_REMOTE_SERVER_IP       - EC2 IP (staging)
#   STG_IIS_UI_PHYSICAL_PATH   - Physical path of Angular site on staging IIS
#   STG_IIS_API_PHYSICAL_PATH  - Physical path of .NET API on staging IIS
#   STG_IIS_APP_POOL_NAME      - IIS app pool name (staging)
#   STG_HEALTH_CHECK_URL       - Health check URL (staging)
#
#   SLACK_WEBHOOK_URL           - Slack Incoming Webhook URL (secured)
#   SNYK_TOKEN                  - Snyk API token for security scanning (secured)
# =============================================================================

options:
  max-time: 60   # Global max pipeline duration in minutes

# Default image for UI/Node steps
image: node:20-bullseye-slim

# =============================================================================
# DEFINITIONS — Reusable steps via YAML anchors (DRY principle)
# =============================================================================
definitions:

  caches:
    npm-cache: node_modules/.cache
    nuget:     ~/.nuget/packages

  # ── Reusable script blocks ──────────────────────────────────────────────────
  script-blocks:

    # Installs nothing — SSH is handled by Bitbucket SSH key settings
    # (Key is auto-injected into ~/.ssh/id_rsa by Bitbucket)
    setup-ssh: &setup-ssh
      - mkdir -p ~/.ssh && chmod 700 ~/.ssh
      - echo "SSH identity loaded by Bitbucket key management."

    notify-success: &notify-success
      - |
        curl -s -X POST -H 'Content-type: application/json' \
          --data "{
            \"attachments\": [{
              \"color\": \"good\",
              \"title\": \"✅ Pipeline Succeeded\",
              \"text\": \"*Repo:* $BITBUCKET_REPO_SLUG\n*Branch:* \`$BITBUCKET_BRANCH\`\n*Step:* $BITBUCKET_STEP_TRIGGERER_UUID\n*Build:* <$BITBUCKET_REPO_FULL_NAME/addon/pipelines/home#!/results/$BITBUCKET_BUILD_NUMBER|#$BITBUCKET_BUILD_NUMBER>\",
              \"footer\": \"Bitbucket Pipelines\"
            }]
          }" \
          "$SLACK_WEBHOOK_URL" || true

    notify-failure: &notify-failure
      - |
        curl -s -X POST -H 'Content-type: application/json' \
          --data "{
            \"attachments\": [{
              \"color\": \"danger\",
              \"title\": \"❌ Pipeline Failed\",
              \"text\": \"*Repo:* $BITBUCKET_REPO_SLUG\n*Branch:* \`$BITBUCKET_BRANCH\`\n*Build:* <$BITBUCKET_REPO_FULL_NAME/addon/pipelines/home#!/results/$BITBUCKET_BUILD_NUMBER|#$BITBUCKET_BUILD_NUMBER>\n*Triggered by:* $BITBUCKET_STEP_TRIGGERER_UUID\",
              \"footer\": \"Bitbucket Pipelines\"
            }]
          }" \
          "$SLACK_WEBHOOK_URL" || true

  # ── Reusable full step definitions ─────────────────────────────────────────
  steps:

    # ── Step: Lint & Test (Angular) ──────────────────────────────────────────
    - step: &lint-and-test
        name: "🔍 Quality Gate — Lint & Unit Tests"
        caches:
          - node
          - npm-cache
        script:
          - set -euo pipefail
          - npm ci --prefer-offline --legacy-peer-deps
          - npm run lint -- --max-warnings=0
          - npm run test -- --watch=false --browsers=ChromeHeadlessCI --code-coverage --no-progress
        artifacts:
          - coverage/**

    # ── Step: Dependency Security Scan (Snyk) ───────────────────────────────
    - step: &security-scan-ui
        name: "🔐 Security Scan — Dependencies (Snyk)"
        caches:
          - node
        script:
          - set -euo pipefail
          - npm ci --prefer-offline --legacy-peer-deps
          - npx snyk auth $SNYK_TOKEN
          - npx snyk test --severity-threshold=high --json > snyk-report.json || true
          - npx snyk test --severity-threshold=critical   # fail on CRITICAL only
        artifacts:
          - snyk-report.json

    # ── Step: Secret Scanning (Gitleaks) ────────────────────────────────────
    - step: &secret-scan
        name: "🔏 Secret Scan — Gitleaks"
        image: zricethezav/gitleaks:latest
        script:
          - gitleaks detect --source=. --verbose --redact
            --config=.gitleaks.toml 2>/dev/null || gitleaks detect --source=. --verbose --redact

    # ── Step: Build Angular UI ───────────────────────────────────────────────
    - step: &build-ui
        name: "🏗️  Build — Angular UI (Production)"
        size: 2x
        caches:
          - node
          - npm-cache
        script:
          - set -euo pipefail
          - apt-get update -qq && apt-get install -y zip --no-install-recommends
          - npm ci --prefer-offline --legacy-peer-deps
          - npm run build -- --configuration production
                              --output-path=./edge_publish_ui
                              --base-href=/
                              --verbose=false
          # Verify the build actually produced output
          - test -f edge_publish_ui/index.html || (echo "ERROR: build output missing index.html" && exit 1)
          - cd edge_publish_ui && zip -r ../edge_publish_ui.zip . && cd ..
          - echo "📦 UI build artifact size:" && du -sh edge_publish_ui.zip
        artifacts:
          - edge_publish_ui.zip

    # ── Step: Build .NET 8 API ───────────────────────────────────────────────
    - step: &build-api
        name: "🏗️  Build — .NET 8 API (Release)"
        image: mcr.microsoft.com/dotnet/sdk:8.0
        caches:
          - nuget
        script:
          - set -euo pipefail
          - dotnet restore ZENTIXS_EDGE_API/ZENTIXS_EDGE_API.csproj --no-cache
          - dotnet build   ZENTIXS_EDGE_API/ZENTIXS_EDGE_API.csproj -c Release --no-restore
          - dotnet test    ZENTIXS_EDGE_API/ZENTIXS_EDGE_API.csproj -c Release --no-build
                           --logger trx --results-directory ./test-results || true
          - dotnet publish ZENTIXS_EDGE_API/ZENTIXS_EDGE_API.csproj -c Release -o edge_publish_api --no-build
          - apt-get update -qq && apt-get install -y zip --no-install-recommends
          # Strip environment-specific configs — they are protected on server
          - rm -f edge_publish_api/appsettings.json
                  edge_publish_api/appsettings.Development.json
                  edge_publish_api/web.config
          - cd edge_publish_api && zip -r ../edge_publish_api.zip . && cd ..
          - echo "📦 API build artifact size:" && du -sh edge_publish_api.zip
        artifacts:
          - edge_publish_api.zip
          - test-results/**

# =============================================================================
# PIPELINES
# =============================================================================
pipelines:

  # ── Default: runs on every branch (quality gate only) ─────────────────────
  default:
    - parallel:
        - step: *lint-and-test
        - step: *secret-scan

  # ── Branch-specific pipelines ──────────────────────────────────────────────
  branches:

    # ════════════════════════════════════════════════════════════════════════
    # DEVELOP → STAGING (automatic full deploy)
    # ════════════════════════════════════════════════════════════════════════
    develop:

      # Stage 1: Parallel quality gates
      - parallel:
          - step: *lint-and-test
          - step: *secret-scan

      # Stage 2: Parallel builds
      - parallel:
          - step: *build-ui
          - step:
              <<: *build-api
              name: "🏗️  Build — .NET 8 API (Staging)"

      # Stage 3: Deploy UI to Staging
      - step:
          name: "🚀 Deploy UI → Staging"
          deployment: staging
          script:
            - set -euo pipefail
            - *setup-ssh
            - apt-get update -qq && apt-get install -y openssh-client --no-install-recommends

            # Upload build artifact to staging server
            - scp -o BatchMode=yes
                edge_publish_ui.zip
                $STG_REMOTE_USERNAME@$STG_REMOTE_SERVER_IP:C:/temp/edge_publish_ui.zip

            # Inject Bitbucket variables into deploy script, upload, execute
            - sed "s|IIS_UI_PHYSICAL_PATH_PLACEHOLDER|$STG_IIS_UI_PHYSICAL_PATH|g"
                scripts/windows/deploy_ui.ps1 > deploy_ui_staging.ps1

            - scp -o BatchMode=yes deploy_ui_staging.ps1
                $STG_REMOTE_USERNAME@$STG_REMOTE_SERVER_IP:C:/temp/deploy_ui.ps1

            - ssh -o BatchMode=yes $STG_REMOTE_USERNAME@$STG_REMOTE_SERVER_IP
                "powershell -ExecutionPolicy Bypass -File C:\\temp\\deploy_ui.ps1"
          after-script:
            - *notify-failure

      # Stage 4: Deploy API to Staging (manual to avoid unnecessary downtime)
      - step:
          name: "🚀 Deploy API → Staging"
          deployment: staging
          trigger: manual
          image: mcr.microsoft.com/dotnet/sdk:8.0
          script:
            - set -euo pipefail
            - *setup-ssh
            - apt-get update -qq && apt-get install -y openssh-client --no-install-recommends

            - scp -o BatchMode=yes
                edge_publish_api.zip
                $STG_REMOTE_USERNAME@$STG_REMOTE_SERVER_IP:C:/temp/edge_publish_api.zip

            - sed -e "s|IIS_API_PHYSICAL_PATH_PLACEHOLDER|$STG_IIS_API_PHYSICAL_PATH|g" \
                  -e "s|IIS_APP_POOL_NAME_PLACEHOLDER|$STG_IIS_APP_POOL_NAME|g" \
                  scripts/windows/deploy_api.ps1 > deploy_api_staging.ps1

            - scp -o BatchMode=yes deploy_api_staging.ps1
                $STG_REMOTE_USERNAME@$STG_REMOTE_SERVER_IP:C:/temp/deploy_api.ps1

            - ssh -o BatchMode=yes $STG_REMOTE_USERNAME@$STG_REMOTE_SERVER_IP
                "powershell -ExecutionPolicy Bypass -File C:\\temp\\deploy_api.ps1"
          after-script:
            - *notify-failure

      # Stage 5: Smoke Test on Staging
      - step:
          name: "🧪 Smoke Test — Staging"
          image: curlimages/curl:latest
          script:
            - sh tests/smoke-test.sh "$STG_HEALTH_CHECK_URL" 5 15

    # ════════════════════════════════════════════════════════════════════════
    # MAIN → STAGING → PRODUCTION (full promotion pipeline)
    # ════════════════════════════════════════════════════════════════════════
    main:

      # Stage 1: Parallel quality gates + security scan
      - parallel:
          - step: *lint-and-test
          - step: *secret-scan
          - step: *security-scan-ui

      # Stage 2: Parallel builds
      - parallel:
          - step: *build-ui
          - step: *build-api

      # Stage 3: Deploy UI to Staging (validation gate before prod)
      - step:
          name: "🔀 Deploy UI → Staging (Pre-Prod Validation)"
          deployment: staging
          script:
            - set -euo pipefail
            - *setup-ssh
            - apt-get update -qq && apt-get install -y openssh-client --no-install-recommends

            - scp -o BatchMode=yes
                edge_publish_ui.zip
                $STG_REMOTE_USERNAME@$STG_REMOTE_SERVER_IP:C:/temp/edge_publish_ui.zip

            - sed "s|IIS_UI_PHYSICAL_PATH_PLACEHOLDER|$STG_IIS_UI_PHYSICAL_PATH|g"
                scripts/windows/deploy_ui.ps1 > deploy_ui_staging.ps1

            - scp -o BatchMode=yes deploy_ui_staging.ps1
                $STG_REMOTE_USERNAME@$STG_REMOTE_SERVER_IP:C:/temp/deploy_ui.ps1

            - ssh -o BatchMode=yes $STG_REMOTE_USERNAME@$STG_REMOTE_SERVER_IP
                "powershell -ExecutionPolicy Bypass -File C:\\temp\\deploy_ui.ps1"

      # Stage 4: Smoke test staging before promoting to prod
      - step:
          name: "🧪 Smoke Test — Staging (Production Candidate)"
          image: curlimages/curl:latest
          script:
            - sh tests/smoke-test.sh "$STG_HEALTH_CHECK_URL" 8 20

      # Stage 5: Deploy UI to Production (manual gate)
      - step:
          name: "🚀 Deploy UI → Production"
          deployment: production
          trigger: manual
          script:
            - set -euo pipefail
            - *setup-ssh
            - apt-get update -qq && apt-get install -y openssh-client --no-install-recommends

            # Archive previous deployment for instant rollback
            - ssh -o BatchMode=yes $PROD_REMOTE_USERNAME@$PROD_REMOTE_SERVER_IP
                "powershell -ExecutionPolicy Bypass -Command \"
                  \$ts = Get-Date -Format 'yyyyMMdd_HHmmss';
                  New-Item -ItemType Directory -Path 'C:\\releases\\ui' -Force | Out-Null;
                  if (Test-Path '$PROD_IIS_UI_PHYSICAL_PATH') {
                    Copy-Item -Path '$PROD_IIS_UI_PHYSICAL_PATH\\*'
                              -Destination \"C:\\releases\\ui\\\\$ts\" -Recurse -Force;
                    Write-Host \"Backup created: C:\\releases\\ui\\\\$ts\";
                  }
                  Get-ChildItem 'C:\\releases\\ui' |
                    Sort-Object LastWriteTime -Descending |
                    Select-Object -Skip 3 |
                    Remove-Item -Recurse -Force
                \""

            - scp -o BatchMode=yes
                edge_publish_ui.zip
                $PROD_REMOTE_USERNAME@$PROD_REMOTE_SERVER_IP:C:/temp/edge_publish_ui.zip

            - sed "s|IIS_UI_PHYSICAL_PATH_PLACEHOLDER|$PROD_IIS_UI_PHYSICAL_PATH|g"
                scripts/windows/deploy_ui.ps1 > deploy_ui_prod.ps1

            - scp -o BatchMode=yes deploy_ui_prod.ps1
                $PROD_REMOTE_USERNAME@$PROD_REMOTE_SERVER_IP:C:/temp/deploy_ui.ps1

            - ssh -o BatchMode=yes $PROD_REMOTE_USERNAME@$PROD_REMOTE_SERVER_IP
                "powershell -ExecutionPolicy Bypass -File C:\\temp\\deploy_ui.ps1"
          after-script:
            - *notify-failure

      # Stage 6: Smoke Test on Production after UI deploy
      - step:
          name: "🧪 Smoke Test — Production UI"
          image: curlimages/curl:latest
          script:
            - sh tests/smoke-test.sh "$PROD_HEALTH_CHECK_URL" 8 20
          after-script:
            - |
              if [ "$BITBUCKET_EXIT_CODE" -eq 0 ]; then
                curl -s -X POST -H 'Content-type: application/json' \
                  --data "{
                    \"attachments\": [{
                      \"color\": \"good\",
                      \"title\": \"🚀 Production UI Deployed Successfully\",
                      \"text\": \"*Build:* #$BITBUCKET_BUILD_NUMBER\n*Branch:* \`$BITBUCKET_BRANCH\`\n*Commit:* \`$BITBUCKET_COMMIT\`\n*Deployed by:* $BITBUCKET_STEP_TRIGGERER_UUID\",
                      \"footer\": \"Bitbucket Pipelines\"
                    }]
                  }" "$SLACK_WEBHOOK_URL" || true
              else
                curl -s -X POST -H 'Content-type: application/json' \
                  --data "{
                    \"attachments\": [{
                      \"color\": \"danger\",
                      \"title\": \"🔥 PROD Smoke Test FAILED — Rollback may be needed!\",
                      \"text\": \"*Build:* #$BITBUCKET_BUILD_NUMBER\n*Branch:* \`$BITBUCKET_BRANCH\`\n*Action:* Trigger \`rollback-ui-production\` pipeline immediately.\",
                      \"footer\": \"Bitbucket Pipelines\"
                    }]
                  }" "$SLACK_WEBHOOK_URL" || true
              fi

      # Stage 7: Deploy API to Production (manual gate — causes brief downtime)
      - step:
          name: "🚀 Deploy API → Production"
          deployment: production
          trigger: manual
          image: mcr.microsoft.com/dotnet/sdk:8.0
          script:
            - set -euo pipefail
            - *setup-ssh
            - apt-get update -qq && apt-get install -y openssh-client --no-install-recommends

            # Archive previous API for instant rollback
            - ssh -o BatchMode=yes $PROD_REMOTE_USERNAME@$PROD_REMOTE_SERVER_IP
                "powershell -ExecutionPolicy Bypass -Command \"
                  \$ts = Get-Date -Format 'yyyyMMdd_HHmmss';
                  New-Item -ItemType Directory -Path 'C:\\releases\\api' -Force | Out-Null;
                  if (Test-Path '$PROD_IIS_API_PHYSICAL_PATH') {
                    Copy-Item -Path '$PROD_IIS_API_PHYSICAL_PATH\\*'
                              -Destination \"C:\\releases\\api\\\\$ts\" -Recurse -Force;
                    Write-Host \"Backup created: C:\\releases\\api\\\\$ts\";
                  }
                  Get-ChildItem 'C:\\releases\\api' |
                    Sort-Object LastWriteTime -Descending |
                    Select-Object -Skip 3 |
                    Remove-Item -Recurse -Force
                \""

            - scp -o BatchMode=yes
                edge_publish_api.zip
                $PROD_REMOTE_USERNAME@$PROD_REMOTE_SERVER_IP:C:/temp/edge_publish_api.zip

            - sed -e "s|IIS_API_PHYSICAL_PATH_PLACEHOLDER|$PROD_IIS_API_PHYSICAL_PATH|g" \
                  -e "s|IIS_APP_POOL_NAME_PLACEHOLDER|$PROD_IIS_APP_POOL_NAME|g" \
                  scripts/windows/deploy_api.ps1 > deploy_api_prod.ps1

            - scp -o BatchMode=yes deploy_api_prod.ps1
                $PROD_REMOTE_USERNAME@$PROD_REMOTE_SERVER_IP:C:/temp/deploy_api.ps1

            - ssh -o BatchMode=yes $PROD_REMOTE_USERNAME@$PROD_REMOTE_SERVER_IP
                "powershell -ExecutionPolicy Bypass -File C:\\temp\\deploy_api.ps1"
          after-script:
            - |
              if [ "$BITBUCKET_EXIT_CODE" -eq 0 ]; then
                curl -s -X POST -H 'Content-type: application/json' \
                  --data "{
                    \"attachments\": [{
                      \"color\": \"good\",
                      \"title\": \"🚀 Production API Deployed Successfully\",
                      \"text\": \"*Build:* #$BITBUCKET_BUILD_NUMBER\n*Branch:* \`$BITBUCKET_BRANCH\`\n*Commit:* \`$BITBUCKET_COMMIT\`\",
                      \"footer\": \"Bitbucket Pipelines\"
                    }]
                  }" "$SLACK_WEBHOOK_URL" || true
              else
                curl -s -X POST -H 'Content-type: application/json' \
                  --data "{
                    \"attachments\": [{
                      \"color\": \"danger\",
                      \"title\": \"🔥 PROD API Deploy FAILED — Rollback may be needed!\",
                      \"text\": \"*Build:* #$BITBUCKET_BUILD_NUMBER\n*Branch:* \`$BITBUCKET_BRANCH\`\n*Action:* Trigger \`rollback-api-production\` pipeline immediately.\",
                      \"footer\": \"Bitbucket Pipelines\"
                    }]
                  }" "$SLACK_WEBHOOK_URL" || true
              fi

      # Stage 8: Final API smoke test
      - step:
          name: "🧪 Smoke Test — Production API"
          image: curlimages/curl:latest
          script:
            - sh tests/smoke-test.sh "$PROD_HEALTH_CHECK_URL" 8 20

  # ── Custom pipelines (manual triggers) ────────────────────────────────────
  custom:

    # ══════════════════════════════════════════════════════════════════════
    # ROLLBACK — UI (Production)
    # Restores the previous UI release without a full redeploy
    # ══════════════════════════════════════════════════════════════════════
    rollback-ui-production:
      - step:
          name: "⏪ Rollback UI — Production (N-1 Release)"
          deployment: production
          script:
            - set -euo pipefail
            - *setup-ssh
            - apt-get update -qq && apt-get install -y openssh-client --no-install-recommends

            - scp -o BatchMode=yes scripts/windows/rollback_ui.ps1 $PROD_REMOTE_USERNAME@$PROD_REMOTE_SERVER_IP:C:/temp/rollback_ui.ps1

            - ssh -o BatchMode=yes $PROD_REMOTE_USERNAME@$PROD_REMOTE_SERVER_IP
                "powershell -ExecutionPolicy Bypass -File C:\\temp\\rollback_ui.ps1
                 -IisUiPath '$PROD_IIS_UI_PHYSICAL_PATH'"
          after-script:
            - |
              curl -s -X POST -H 'Content-type: application/json' \
                --data "{
                  \"attachments\": [{
                    \"color\": \"warning\",
                    \"title\": \"⏪ UI Rollback Executed — Production\",
                    \"text\": \"*Status:* Exit code $BITBUCKET_EXIT_CODE\n*Build:* #$BITBUCKET_BUILD_NUMBER\",
                    \"footer\": \"Bitbucket Pipelines\"
                  }]
                }" "$SLACK_WEBHOOK_URL" || true

    # ══════════════════════════════════════════════════════════════════════
    # ROLLBACK — API (Production)
    # ══════════════════════════════════════════════════════════════════════
    rollback-api-production:
      - step:
          name: "⏪ Rollback API — Production (N-1 Release)"
          deployment: production
          image: mcr.microsoft.com/dotnet/sdk:8.0
          script:
            - set -euo pipefail
            - *setup-ssh
            - apt-get update -qq && apt-get install -y openssh-client --no-install-recommends

            - scp -o BatchMode=yes scripts/windows/rollback_api.ps1 $PROD_REMOTE_USERNAME@$PROD_REMOTE_SERVER_IP:C:/temp/rollback_api.ps1

            - ssh -o BatchMode=yes $PROD_REMOTE_USERNAME@$PROD_REMOTE_SERVER_IP
                "powershell -ExecutionPolicy Bypass -File C:\\temp\\rollback_api.ps1
                 -IisApiPath '$PROD_IIS_API_PHYSICAL_PATH'
                 -AppPoolName '$PROD_IIS_APP_POOL_NAME'"
          after-script:
            - |
              curl -s -X POST -H 'Content-type: application/json' \
                --data "{
                  \"attachments\": [{
                    \"color\": \"warning\",
                    \"title\": \"⏪ API Rollback Executed — Production\",
                    \"text\": \"*Status:* Exit code $BITBUCKET_EXIT_CODE\n*Build:* #$BITBUCKET_BUILD_NUMBER\",
                    \"footer\": \"Bitbucket Pipelines\"
                  }]
                }" "$SLACK_WEBHOOK_URL" || true

    # ══════════════════════════════════════════════════════════════════════
    # MANUAL: Run smoke test only (useful for post-hotfix verification)
    # ══════════════════════════════════════════════════════════════════════
    smoke-test-production:
      - step:
          name: "🧪 Smoke Test — Production (Manual)"
          image: curlimages/curl:latest
          script:
            - sh tests/smoke-test.sh "$PROD_HEALTH_CHECK_URL" 10 30

    # ══════════════════════════════════════════════════════════════════════
    # MANUAL: Deploy legacy API pipeline (original cicd-pipeline branch flow)
    # Kept for backward compatibility with old deployment runbooks
    # ══════════════════════════════════════════════════════════════════════
    deploy-edge-api:
      - step:
          name: "🏗️  Build Edge API (Legacy)"
          image: mcr.microsoft.com/dotnet/sdk:8.0
          caches:
            - nuget
          script:
            - set -euo pipefail
            - dotnet restore ZENTIXS_EDGE_API/ZENTIXS_EDGE_API.csproj
            - dotnet publish ZENTIXS_EDGE_API/ZENTIXS_EDGE_API.csproj -c Release -o edge_publish_api
            - apt-get update -qq && apt-get install -y zip --no-install-recommends
            - rm -f edge_publish_api/appsettings.json
                    edge_publish_api/appsettings.Development.json
                    edge_publish_api/web.config
            - cd edge_publish_api && zip -r ../edge_publish_api.zip . && cd ..
          artifacts:
            - edge_publish_api.zip

      - step:
          name: "🚀 Deploy Edge API (Legacy — Production)"
          trigger: manual
          deployment: production
          image: mcr.microsoft.com/dotnet/sdk:8.0
          script:
            - set -euo pipefail
            - *setup-ssh
            - apt-get update -qq && apt-get install -y openssh-client --no-install-recommends

            - scp -o BatchMode=yes
                edge_publish_api.zip
                $PROD_REMOTE_USERNAME@$PROD_REMOTE_SERVER_IP:C:/temp/edge_publish_api.zip

            - sed -e "s|IIS_API_PHYSICAL_PATH_PLACEHOLDER|$PROD_IIS_API_PHYSICAL_PATH|g" \
                  -e "s|IIS_APP_POOL_NAME_PLACEHOLDER|$PROD_IIS_APP_POOL_NAME|g" \
                  scripts/deploy_api.ps1 > deploy_api_prod.ps1

            - scp -o BatchMode=yes deploy_api_prod.ps1
                $PROD_REMOTE_USERNAME@$PROD_REMOTE_SERVER_IP:C:/temp/deploy_api.ps1

            - ssh -o BatchMode=yes $PROD_REMOTE_USERNAME@$PROD_REMOTE_SERVER_IP
                "powershell -ExecutionPolicy Bypass -File C:\\temp\\deploy_api.ps1"
